[project]
name = "university-space-api"
version = "0.1.0"
description = "API foundation for a multi-tenant university space management service"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn>=0.41,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.0,<3",
    "alembic>=1.13,<2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["httpx2>=2.13,<3"]

[tool.setuptools.packages.find]
include = ["app*"]
